# Local database only; production uses Render's DATABASE_URL.
services:
  postgres:
    image: postgres:16-alpine
    container_name: monkmode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monkmode
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d monkmode"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
